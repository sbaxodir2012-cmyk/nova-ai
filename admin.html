<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nova AI Admin</title><style>body{font-family:system-ui;background:#0b1026;color:#e8eaf6;max-width:760px;margin:30px auto;padding:0 16px}input,button{padding:10px;border-radius:10px;border:1px solid #252d5e;background:#161d45;color:inherit}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:8px;border-bottom:1px solid #252d5e;text-align:right}td:first-child,th:first-child{text-align:left}.t{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}.c{background:#161d45;border-radius:12px;padding:14px}.c b{font-size:26px;display:block}</style></head><body><h1>Nova AI statistika</h1><input id="k" type="password" placeholder="Admin kalit"> <button id="go">Kirish</button><div id="o"></div><script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{const r=await fetch('/api/stats',{headers:{Authorization:'Bearer '+$('k').value}});const j=await r.json();if(!r.ok){$('o').textContent=j.error;return}
const L={v:'Yangi tashrifchi',q:'Savol',i:'Rasmli',s:'Internet',e:'Xato/limit'},K=Object.keys(L),T={};
j.days.forEach(d=>K.forEach(k=>T[k]=(T[k]||0)+(+d[k]||0)));
$('o').innerHTML='<div class="t">'+K.map(k=>`<div class="c">${L[k]}<b>${T[k]||0}</b></div>`).join('')+'</div><table><tr><th>Kun</th>'+K.map(k=>`<th>${L[k]}</th>`).join('')+'</tr>'+j.days.slice().reverse().map(d=>`<tr><td>${String(d.d).replace(/[<>&]/g,'')}</td>`+K.map(k=>`<td>${+d[k]||0}</td>`).join('')+'</tr>').join('')+'</table>'};
</script></body></html>
