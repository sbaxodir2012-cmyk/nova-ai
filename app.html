<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI Chat</title><meta name="description" content="Chat with Nova AI, a free multilingual AI assistant.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#0b1026;--side:#10163a;--card:#161d45;--bd:#252d5e;--tx:#e8eaf6;--mu:#98a0cc;--ac:#7c3aed}
:root[data-theme=light]{--bg:#f6f7fd;--side:#eceefb;--card:#fff;--bd:#d9dcf2;--tx:#1b1f3b;--mu:#5d648f}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
aside{width:280px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:8px;transition:transform .25s}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;padding:4px}
.new{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:10px;padding:10px;font-weight:600}
input.s{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:8px;padding:2px 4px 2px 10px;animation:in .2s}.it:hover,.it.on{background:var(--card)}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 0;cursor:pointer}.it button{opacity:.6;padding:4px 6px}.it button:hover{opacity:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd)}.top b{flex:1}
#msgs{flex:1;overflow:auto;padding:20px 14px}.w{max-width:780px;margin:auto}
.m{margin:0 0 18px;animation:in .25s}.u{display:flex;justify-content:flex-end}.u div{background:var(--ac);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.a .md{line-height:1.65;overflow-wrap:anywhere}.md pre{border-radius:10px;overflow:auto;padding:0}.md pre code{padding:14px!important}.md code{font-size:.9em}
.md :not(pre)>code{background:var(--card);padding:2px 6px;border-radius:6px}.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--bd);padding:6px 10px}
.act{display:flex;gap:6px;margin-top:4px;color:var(--mu);font-size:13px}.act button:hover{color:var(--tx)}
.err{color:#f87171}.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.empty{text-align:center;margin-top:12vh}.empty h1{font-size:32px;margin:8px 0}.empty p{color:var(--mu)}
.bar{padding:12px 14px 18px}.box{max-width:780px;margin:auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--tx);font:inherit;max-height:180px;padding:6px}
#send{background:var(--ac);color:#fff;border-radius:10px;padding:8px 14px}#send:disabled{opacity:.5}
.note{text-align:center;font-size:12px;color:var(--mu);margin-top:6px}
#menu{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@keyframes b{50%{transform:translateY(-5px)}}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%)}aside.open{transform:none}#menu{display:block}}
</style></head>
<body>
<aside id="side">
<div class="logo"><img src="/favicon.svg" width="28" height="28" alt="">Nova AI</div>
<button class="new" id="new">+ New chat</button>
<input class="s" id="q" placeholder="Search chats…" aria-label="Search chats">
<div id="list"></div>
<button id="theme" style="text-align:left;padding:8px">🌓 Toggle theme</button>
</aside>
<main>
<div class="top"><button id="menu" aria-label="Menu">☰</button><b id="title">Nova AI</b></div>
<div id="msgs"><div class="w" id="w"></div></div>
<div class="bar"><div class="box"><textarea id="in" rows="1" placeholder="Ask Nova anything…" aria-label="Message"></textarea><button id="send">Send</button></div>
<div class="note">Nova AI can make mistakes. Chats are stored only in your browser.</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
let chats=[],cur=null,busy=false,ctl=null;
const load=()=>{try{chats=JSON.parse(localStorage.getItem('nova.chats')||'[]')}catch{chats=[]}};
const save=()=>{try{localStorage.setItem('nova.chats',JSON.stringify(chats))}catch{}};
const get=()=>chats.find(c=>c.id===cur);
const md=t=>DOMPurify.sanitize(marked.parse(t,{breaks:true}));
function hl(el){el.querySelectorAll('pre code').forEach(b=>{try{hljs.highlightElement(b)}catch{}})}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('nova.theme',t)}catch{}}
function renderList(){
  const q=$('q').value.toLowerCase();$('list').innerHTML='';
  chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q)))
   .sort((a,b)=>b.t-a.t).forEach(c=>{
    const d=document.createElement('div');d.className='it'+(c.id===cur?' on':'');
    const s=document.createElement('span');s.textContent=c.title;s.onclick=()=>{cur=c.id;$('side').classList.remove('open');render()};
    const r=document.createElement('button');r.textContent='✎';r.title='Rename';r.onclick=()=>{const n=prompt('Rename chat',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,80);save();render()}};
    const x=document.createElement('button');x.textContent='🗑';x.title='Delete';x.onclick=()=>{if(confirm('Delete this chat?')){chats=chats.filter(k=>k!==c);if(cur===c.id)cur=null;save();render()}};
    d.append(s,r,x);$('list').append(d)});
}
function msgEl(m,i,last){
  const e=document.createElement('div');e.className='m '+(m.role==='user'?'u':'a');
  if(m.role==='user'){const d=document.createElement('div');d.textContent=m.content;e.append(d);return e}
  const b=document.createElement('div');b.className='md'+(m.error?' err':'');b.innerHTML=m.error?DOMPurify.sanitize(m.content):md(m.content);hl(b);e.append(b);
  const a=document.createElement('div');a.className='act';
  const c=document.createElement('button');c.textContent='Copy';c.onclick=()=>{navigator.clipboard.writeText(m.content);c.textContent='Copied ✓';setTimeout(()=>c.textContent='Copy',1200)};a.append(c);
  if(last){const g=document.createElement('button');g.textContent='Regenerate';g.onclick=()=>regen();a.append(g)}
  e.append(a);return e;
}
function render(){
  renderList();const c=get(),w=$('w');w.innerHTML='';$('title').textContent=c?c.title:'Nova AI';
  if(!c||!c.messages.length){w.innerHTML='<div class="empty"><img src="/favicon.svg" width="64" alt=""><h1>Nova AI</h1><p>Ask Anything. Learn Everything.</p></div>';return}
  c.messages.forEach((m,i)=>w.append(msgEl(m,i,i===c.messages.length-1&&m.role==='assistant')));
  $('msgs').scrollTop=1e9;
}
async function run(){
  const c=get();busy=true;$('send').textContent='Stop';
  const box=document.createElement('div');box.className='m a';box.innerHTML='<div class="md"><div class="dots"><span></span><span></span><span></span></div></div>';
  $('w').append(box);$('msgs').scrollTop=1e9;
  const hist=c.messages.slice(-30).filter(m=>!m.error).map(({role,content})=>({role,content}));
  let out='',failed=null;ctl=new AbortController();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist}),signal:ctl.signal});
    if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.error||'Request failed ('+r.status+')')}
    const rd=r.body.getReader(),dc=new TextDecoder();
    for(;;){const{done,value}=await rd.read();if(done)break;out+=dc.decode(value,{stream:true});
      const el=box.querySelector('.md');el.innerHTML=md(out);hl(el);$('msgs').scrollTop=1e9}
  }catch(e){if(e.name!=='AbortError')failed=e.message}
  if(failed)c.messages.push({role:'assistant',content:'⚠️ '+failed,error:true});
  else if(out)c.messages.push({role:'assistant',content:out});
  c.t=Date.now();save();busy=false;ctl=null;$('send').textContent='Send';render();
}
function send(){
  if(busy){ctl&&ctl.abort();return}
  const t=$('in').value.trim();if(!t)return;if(t.length>8000){alert('Message too long (max 8000 characters).');return}
  let c=get();if(!c){c={id:crypto.randomUUID(),title:t.slice(0,40),messages:[],t:Date.now()};chats.push(c);cur=c.id}
  c.messages.push({role:'user',content:t});$('in').value='';$('in').style.height='auto';save();render();run();
}
function regen(){const c=get();if(!c||busy)return;while(c.messages.length&&c.messages[c.messages.length-1].role==='assistant')c.messages.pop();save();render();run()}
$('send').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('new').onclick=()=>{cur=null;$('side').classList.remove('open');render();$('in').focus()};
$('q').oninput=renderList;$('menu').onclick=()=>$('side').classList.toggle('open');
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
try{setTheme(localStorage.getItem('nova.theme')||'dark')}catch{setTheme('dark')}
load();render();
</script>
</body></html>
